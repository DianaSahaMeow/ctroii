services:
  - type: web
    name: defect-tracker
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL
        fromDatabase:
          name: defect-tracker-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /app/uploads/defects

databases:
  - name: defect-tracker-db
    plan: free
    region: frankfurt
    databaseName: defect_tracker
    user: postgres
